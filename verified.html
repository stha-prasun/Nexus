<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email verified · Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Move to tailwind.config.ts when converting to React + TS
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            cobalt: { DEFAULT: '#1F2FE0', dark: '#1521B5' },
            ink: { DEFAULT: '#14183A', soft: '#5A6080', line: '#D5D9EC' },
            sun: { DEFAULT: '#FFD83D', dark: '#F2C70F' },
            mist: '#EEF0F8',
          },
        },
      },
    }
  </script>
  <style>
    .canvas { background-color:#1F2FE0; background-image:radial-gradient(rgba(255,255,255,.18) 1.2px, transparent 1.2px); background-size:28px 28px; animation:drift 16s linear infinite; }
    .t { font:600 15px Figtree,sans-serif; fill:#14183A; }
    .av { font:600 10px Figtree,sans-serif; fill:#5A6080; text-anchor:middle; }
    .chip,.s-in,.ripple { transform-box:fill-box; transform-origin:center; }

    /* 1. Panel rises first, its contents follow */
    .panel-wrap { animation:panelIn .7s cubic-bezier(.2,.7,.2,1) backwards; }
    #panel > * { animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:calc(.15s + var(--i,0) * .06s); }
    /* 2. Lines grow outward from the panel, chips pop in as each line arrives */
    .edge-out { stroke-dasharray:1; stroke-dashoffset:-1; animation:drawOut 1s cubic-bezier(.3,.6,.2,1) var(--d) forwards; }
    .edge-in  { stroke-dasharray:1; stroke-dashoffset:1;  animation:drawIn .7s ease-out var(--d) forwards; }
    .chip { animation:chipIn .6s cubic-bezier(.3,1.5,.5,1) var(--d) backwards; }
    .check { stroke-dasharray:1; stroke-dashoffset:1; animation:drawIn .4s ease-out var(--c) forwards; }
    /* 3. Work gets done: one state fades out, the next pops in at time --t */
    .s-out { animation:fadeOut .25s var(--t) forwards; }
    .s-in  { opacity:0; animation:popIn .5s cubic-bezier(.3,1.4,.5,1) var(--t) forwards; }
    .ripple { animation:ripple .8s ease-out var(--t) forwards; }
    .lbl { animation:toMuted .4s var(--t) forwards; }
    .strike { stroke-dasharray:1; stroke-dashoffset:1; animation:drawIn .4s ease-out calc(var(--t) + .1s) forwards; }
    /* 4. Ambient: sonar rings from the panel, graph brightens while typing */
    .ring { position:absolute; inset:0; border:1.5px solid rgba(255,255,255,.55); border-radius:6px; opacity:0; animation:ring 5s ease-out var(--d,1.6s) infinite; }
    .edges { transition:stroke .4s; }
    .graph.active .edges { stroke:rgba(255,255,255,.9); }
    /* Feedback */
    #form-error:not(.hidden) { animation:rise .3s ease-out; }
    .shake { animation:shake .45s ease-in-out; }

    @keyframes drift { to { background-position:28px 28px; } }
    @keyframes panelIn { from { opacity:0; transform:translateY(24px) scale(.98); } }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } }
    @keyframes drawOut { from { stroke-dashoffset:-1; } to { stroke-dashoffset:0; } }
    @keyframes drawIn { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
    @keyframes chipIn { from { opacity:0; transform:scale(.85); } }
    @keyframes fadeOut { to { opacity:0; } }
    @keyframes popIn { 0% { opacity:0; transform:scale(.3); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
    @keyframes ripple { from { opacity:.9; transform:scale(1); } to { opacity:0; transform:scale(3); } }
    @keyframes toMuted { to { fill:#5A6080; } }
    @keyframes ring { 0% { opacity:.45; transform:scale(1); } 100% { opacity:0; transform:scale(1.22); } }
    @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }

    /* Reduced motion: skip straight to the final state */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; }
      .edge-out,.edge-in,.check,.strike { stroke-dashoffset:0; }
      .s-out,.ring { opacity:0; }
      .s-in { opacity:1; }
      .ripple { opacity:0; }
      .lbl { fill:#5A6080; }
    }

    /* Verified state */
    .v-disc, .v-ripple { transform-box:fill-box; transform-origin:center; }
    .v-disc { opacity:0; animation:popIn .6s cubic-bezier(.3,1.4,.5,1) .35s forwards; }
    .v-check { stroke-dasharray:1; stroke-dashoffset:1; animation:drawIn .45s ease-out .85s forwards; }
    .v-ripple { opacity:0; animation:vRipple 1.2s ease-out .9s forwards; }
    .graph .edges { animation:flash 1.5s ease-out .9s; }
    @keyframes vRipple { from { opacity:.6; transform:scale(1); } to { opacity:0; transform:scale(2); } }
    @keyframes flash { 35% { stroke:rgba(255,255,255,1); } }
    @media (prefers-reduced-motion: reduce) {
      .v-disc { opacity:1; }
      .v-check { stroke-dashoffset:0; }
      .v-ripple { opacity:0; }
    }
  </style>
</head>
<body class="font-sans text-ink antialiased">
  <main class="canvas relative flex min-h-[100dvh] items-center justify-center overflow-hidden px-4 py-4">

    <!-- ===== Task graph (decorative, desktop only) ===== -->
    <svg class="graph pointer-events-none absolute inset-0 hidden h-full w-full lg:block" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="edges" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5" stroke-linecap="round">
        <path id="e1" class="edge-out" pathLength="1" style="--d:0.3s" d="M290 144 C450 144 520 450 720 450"/>
        <path id="e2" class="edge-out" pathLength="1" style="--d:0.4s" d="M360 424 C500 424 600 450 720 450"/>
        <path id="e3" class="edge-out" pathLength="1" style="--d:0.5s" d="M310 714 C470 714 540 450 720 450"/>
        <path id="e4" class="edge-out" pathLength="1" style="--d:0.35s" d="M1150 174 C990 174 920 450 720 450"/>
        <path id="e5" class="edge-out" pathLength="1" style="--d:0.45s" d="M1050 454 C920 454 820 450 720 450"/>
        <path id="e6" class="edge-out" pathLength="1" style="--d:0.55s" d="M1130 724 C970 724 900 450 720 450"/>
        <path class="edge-in" pathLength="1" style="--d:1.6s" d="M175 168 C175 290 245 280 245 400"/>
        <path class="edge-in" pathLength="1" style="--d:1.7s" d="M195 690 C195 580 245 560 245 448"/>
        <path class="edge-in" pathLength="1" style="--d:1.65s" d="M1265 198 C1265 320 1165 310 1165 430"/>
        <path class="edge-in" pathLength="1" style="--d:1.75s" d="M1245 700 C1245 590 1165 570 1165 478"/>
      </g>
      <g id="pulses" fill="#FFD83D"></g>
      <g class="chip" style="--d:1.15s"><rect x="60" y="120" width="230" height="48" rx="6" fill="#fff"/><circle cx="84" cy="144" r="9" fill="#FFD83D"/><path class="check" pathLength="1" style="--c:1.55s" d="M80 144.5l3 3 5-6" stroke="#14183A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t" x="104" y="149">Ship onboarding v2</text><circle cx="264" cy="144" r="11" fill="#EEF0F8"/><text class="av" x="264" y="148">MK</text></g>
      <g class="chip" style="--d:1.25s"><rect x="130" y="400" width="230" height="48" rx="6" fill="#fff"/><g class="s-out" style="--t:3.4s"><circle cx="154" cy="424" r="8" fill="none" stroke="#1F2FE0" stroke-width="2"/><path d="M154 416a8 8 0 010 16z" fill="#1F2FE0"/></g><g class="s-in" style="--t:3.4s"><circle class="ripple" cx="154" cy="424" r="9" fill="none" stroke="#FFD83D" stroke-width="2"/><circle cx="154" cy="424" r="9" fill="#FFD83D"/><path d="M150 424.5l3 3 5-6" stroke="#14183A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text id="tB" class="t lbl" style="--t:3.4s" x="174" y="429">Review pricing copy</text><line class="strike" data-for="tB" pathLength="1" x1="174" x2="320" y1="424.5" y2="424.5" stroke="#5A6080" stroke-width="1.5" style="--t:3.4s"/><circle cx="334" cy="424" r="11" fill="#EEF0F8"/><text class="av" x="334" y="428">JT</text></g>
      <g class="chip" style="--d:1.35s"><rect x="80" y="690" width="230" height="48" rx="6" fill="#fff"/><g class="s-out" style="--t:3.9s"><circle cx="104" cy="714" r="8" fill="none" stroke="#B5BAD6" stroke-width="2"/></g><g class="s-in" style="--t:3.9s"><circle cx="104" cy="714" r="8" fill="none" stroke="#1F2FE0" stroke-width="2"/><path d="M104 706a8 8 0 010 16z" fill="#1F2FE0"/></g><text class="t" x="124" y="719">Plan Q4 roadmap</text><circle cx="284" cy="714" r="11" fill="#EEF0F8"/><text class="av" x="284" y="718">AS</text></g>
      <g class="chip" style="--d:1.2s"><rect x="1150" y="150" width="230" height="48" rx="6" fill="#fff"/><g class="s-out" style="--t:5.6s"><circle cx="1174" cy="174" r="8" fill="none" stroke="#1F2FE0" stroke-width="2"/><path d="M1174 166a8 8 0 010 16z" fill="#1F2FE0"/></g><g class="s-in" style="--t:5.6s"><circle class="ripple" cx="1174" cy="174" r="9" fill="none" stroke="#FFD83D" stroke-width="2"/><circle cx="1174" cy="174" r="9" fill="#FFD83D"/><path d="M1170 174.5l3 3 5-6" stroke="#14183A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text id="tD" class="t lbl" style="--t:5.6s" x="1194" y="179">Fix checkout timeout</text><line class="strike" data-for="tD" pathLength="1" x1="1194" x2="1340" y1="174.5" y2="174.5" stroke="#5A6080" stroke-width="1.5" style="--t:5.6s"/><circle cx="1354" cy="174" r="11" fill="#EEF0F8"/><text class="av" x="1354" y="178">RP</text></g>
      <g class="chip" style="--d:1.3s"><rect x="1050" y="430" width="230" height="48" rx="6" fill="#fff"/><circle cx="1074" cy="454" r="9" fill="#FFD83D"/><path class="check" pathLength="1" style="--c:1.65s" d="M1070 454.5l3 3 5-6" stroke="#14183A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t" x="1094" y="459">Update API docs</text><circle cx="1254" cy="454" r="11" fill="#EEF0F8"/><text class="av" x="1254" y="458">LW</text></g>
      <g class="chip" style="--d:1.4s"><rect x="1130" y="700" width="230" height="48" rx="6" fill="#fff"/><g class="s-out" style="--t:6.1s"><circle cx="1154" cy="724" r="8" fill="none" stroke="#B5BAD6" stroke-width="2"/></g><g class="s-in" style="--t:6.1s"><circle cx="1154" cy="724" r="8" fill="none" stroke="#1F2FE0" stroke-width="2"/><path d="M1154 716a8 8 0 010 16z" fill="#1F2FE0"/></g><text class="t" x="1174" y="729">Hire design lead</text><circle cx="1334" cy="724" r="11" fill="#EEF0F8"/><text class="av" x="1334" y="728">MK</text></g>
    </svg>

    <!-- ===== Sign-in panel: the "nexus" every task connects to ===== -->
    <div class="panel-wrap relative z-10 w-full max-w-[460px]">
      <span class="ring" aria-hidden="true"></span><span class="ring" style="--d:4.1s" aria-hidden="true"></span>
      <section id="panel" class="relative rounded-md bg-white p-6 shadow-[0_24px_60px_-20px_rgba(10,15,80,.6)] sm:px-8 sm:py-7" aria-labelledby="title">

      <!-- Logo: three connected nodes -->
      <div class="mb-5 flex items-center gap-2.5">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 8.500v3.500M12 12l-5.500 4M12 12l5.500 4" stroke="#1F2FE0" stroke-width="1.800" stroke-linecap="round"/>
          <circle cx="12" cy="6" r="3.500" fill="#FFD83D" stroke="#1F2FE0" stroke-width="1.800"/>
          <circle cx="5.500" cy="17.500" r="2.500" fill="#1F2FE0"/>
          <circle cx="18.500" cy="17.500" r="2.500" fill="#1F2FE0"/>
        </svg>
        <span class="font-display text-xl font-bold tracking-tight">Nexus</span>
      </div>

      <div class="mt-2 flex justify-center">
        <svg class="h-16 w-16 overflow-visible" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="v-ripple" cx="32" cy="32" r="28" fill="none" stroke="#1F2FE0" stroke-width="2"/>
          <circle class="v-disc" cx="32" cy="32" r="28" fill="#FFD83D"/>
          <path class="v-check" pathLength="1" d="M20 33l8 8 16-17" fill="none" stroke="#14183A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="title" class="mt-5 text-center font-display text-[1.75rem] font-bold leading-none tracking-tight">Email verified</h1>
      <p id="msg" role="status" class="mt-2.5 text-center text-[15px] text-ink-soft">Your email address is confirmed. Your Nexus account is ready.</p>

      <a href="login.html"
        class="mt-6 block w-full rounded bg-sun px-4 py-2.5 text-center font-display text-base font-bold tracking-tight text-ink transition hover:bg-sun-dark focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-cobalt/40 active:translate-y-px">
        Continue to sign in
      </a>

      <p class="mt-5 text-center text-sm text-ink-soft">
        Wrong email?
        <a href="signup.html" class="font-semibold text-cobalt underline-offset-2 hover:underline focus-visible:underline">Start over</a>
      </p>
    </section>
    </div>
  </main>

  <script>
    const panel = document.getElementById('panel');
    [...panel.children].forEach((el, i) => el.style.setProperty('--i', i));

    // Show the verified address when the email link passes ?email=you@company.com
    const email = new URLSearchParams(location.search).get('email');
    if (email) {
      const msg = document.getElementById('msg');
      const strong = document.createElement('strong');
      strong.className = 'font-semibold text-ink';
      strong.textContent = email;
      msg.replaceChildren(strong, ' is confirmed. Your Nexus account is ready.');
    }

    // Strike-through lines match each label's real width once the font loads
    document.fonts.ready.then(() => document.querySelectorAll('.strike').forEach((l) => {
      const t = document.getElementById(l.dataset.for);
      if (t) l.setAttribute('x2', +l.getAttribute('x1') + t.getComputedTextLength());
    }));

    // Data pulses travel from each task into the panel (skipped for reduced motion)
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const g = document.getElementById('pulses');
      [[3.2, 2.2], [3.8, 2.9], [4.4, 3.4], [3.5, 2.5], [4.1, 3.1], [3.0, 3.7]].forEach(([dur, begin], i) => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('r', '3.5'); c.setAttribute('opacity', '0');
        c.innerHTML = `<animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines=".45 0 .55 1"><mpath href="#e${i + 1}"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.8;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`;
        g.appendChild(c);
      });
    }
  </script>
</body>
</html>
